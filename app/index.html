<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Companion AI</title>
    <style>
        body { font-family: 'Calibri', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #0b2545; margin-top: 0; }
        .persona-box { margin-bottom: 20px; background: #eef2f7; padding: 10px; border-radius: 8px; }
        select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; width: 250px; }
        #chat-window { height: 400px; border: 1px solid #ddd; border-radius: 8px; padding: 15px; overflow-y: scroll; background: #fafafa; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { margin-bottom: 10px; padding: 10px 14px; border-radius: 8px; max-width: 75%; line-height: 1.4; }
        .user-msg { background: #0072bb; color: white; margin-left: auto; text-align: right; }
        .bot-msg { background: #e2e8f0; color: #111; margin-right: auto; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        button { background: #0b2545; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0072bb; }
        #micBtn { background: #0f766e; }
        #micBtn:hover { background: #14b8a6; }
        #micBtn.listening { background: #dc2626; animation: pulse 1.2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🤖 Campus Companion AI</h2>
        <div class="persona-box">
            <label for="personaSelect"><strong>Select Persona:</strong></label>
            <select id="personaSelect"></select>
        </div>
        <div id="chat-window"></div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Ask about leaves, placements, or university policies..." onkeypress="handleKeyPress(event)">
            <button id="micBtn" onclick="toggleListening()">🎙️ Speak</button>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let cachedVoices = [];

        // Load available browser voices for natural speech selection
        function loadVoices() {
            if ('speechSynthesis' in window) {
                cachedVoices = window.speechSynthesis.getVoices();
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        async function loadUsers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            const select = document.getElementById('personaSelect');
            for (const [id, user] of Object.entries(users)) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = `${user.name} (${user.role.toUpperCase()})`;
                select.appendChild(opt);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatWindow = document.getElementById('chat-window');
            const personaSelect = document.getElementById('personaSelect');
            const text = input.value.trim();
            if (!text) return;

            // Append User Message
            chatWindow.innerHTML += `<div class="message user-msg"><b>You:</b> ${escapeHtml(text)}</div>`;
            input.value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-Id': personaSelect.value
                    },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                chatWindow.innerHTML += `<div class="message bot-msg"><b>Companion:</b> ${escapeHtml(data.reply)}</div>`;
                
                // Speak out the reply with a natural human-like voice and speed
                speakText(data.reply);
            } catch (err) {
                chatWindow.innerHTML += `<div class="message bot-msg" style="color: red;"><b>Error:</b> Could not reach backend.</div>`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Voice Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('userInput').value = speechToText;
                stopListeningState();
                sendMessage();
            };

            recognition.onerror = function() {
                stopListeningState();
            };

            recognition.onend = function() {
                stopListeningState();
            };
        }

        function toggleListening() {
            if (!recognition) {
                alert("Speech Recognition is not supported in this browser. Please use Google Chrome.");
                return;
            }

            const micBtn = document.getElementById('micBtn');
            if (isListening) {
                recognition.stop();
                stopListeningState();
            } else {
                try {
                    recognition.start();
                    isListening = true;
                    micBtn.classList.add('listening');
                    micBtn.textContent = '⏹️ Listening...';
                } catch (e) {
                    stopListeningState();
                }
            }
        }

        function stopListeningState() {
            isListening = false;
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.remove('listening');
            micBtn.textContent = '🎙️ Speak';
        }

        // Human-like Text-to-Speech
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop overlapping speech
                const cleanText = text.replace(/[*#_`]/g, ''); // Strip markdown symbols
                const utterance = new SpeechSynthesisUtterance(cleanText);
                
                // Boost speed to sound snappy and conversational (1.25x - 1.3x)
                utterance.rate = 1.25; 
                utterance.pitch = 1.05; // Slightly warmer pitch

                // Attempt to pick a high-quality natural voice if available
                if (cachedVoices.length === 0) {
                    cachedVoices = window.speechSynthesis.getVoices();
                }
                
                // Look for natural English voices (Google US English, Microsoft Zira/Natural, or Samantha on Mac)
                const preferredVoice = cachedVoices.find(v => 
                    v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Zira') || v.name.includes('Samantha'))
                ) || cachedVoices.find(v => v.lang.startsWith('en'));

                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        loadUsers();
    </script>
</body>
</html>
